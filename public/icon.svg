<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bg)" />
  <!-- Store / Cash Register Icon -->
  <g transform="translate(96, 96)">
    <!-- Base / Drawer -->
    <rect x="20" y="240" width="280" height="60" rx="14" fill="#0f172a" />
    <rect x="130" y="262" width="60" height="12" rx="6" fill="#34d399" />
    <!-- Register Screen & Body -->
    <path d="M40 240 L70 80 L250 80 L280 240 Z" fill="#1e293b" />
    <!-- Screen Display -->
    <rect x="75" y="105" width="170" height="75" rx="10" fill="#022c22" stroke="#059669" stroke-width="4" />
    <text x="160" y="152" fill="#34d399" font-family="monospace" font-size="28" font-weight="bold" text-anchor="middle">Rp 0.00</text>
    <!-- Keypad Keys -->
    <rect x="75" y="195" width="30" height="25" rx="5" fill="#334155" />
    <rect x="120" y="195" width="30" height="25" rx="5" fill="#334155" />
    <rect x="165" y="195" width="30" height="25" rx="5" fill="#334155" />
    <rect x="210" y="195" width="35" height="25" rx="5" fill="url(#accent)" />
    <!-- Receipt Paper -->
    <path d="M120 40 L120 80 L200 80 L200 40 L180 50 L160 40 L140 50 Z" fill="#f8fafc" />
    <line x1="135" y1="56" x2="185" y2="56" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
    <line x1="135" y1="66" x2="170" y2="66" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
  </g>
</svg>
